on:
  workflow_call:
    inputs:
      context:
        description: "The Docker context"
        default: "."
        type: string
      file:
        description: "Path to Dockerfile"
        type: string
      image:
        description: "The full ECR image URI, e.g. <account>.dkr.ecr.<region>.amazonaws.com/<repo>"
        required: true
        type: string
      aws-region:
        description: "AWS region of the ECR registry"
        required: true
        type: string
      environment:
        description: "GitHub environment to run in (for environment-scoped secrets/vars)"
        type: string
      tags:
        description: "List of tags as key-value pair attributes https://github.com/docker/metadata-action/?tab=readme-ov-file#tags-input"
        # Default: strip the leading v, so tag v1.2.3 -> image tag 1.2.3 (legacy convention).
        default: |
          type=semver,pattern={{version}}
        type: string
      labels:
        description: "List of custom labels https://github.com/docker/metadata-action/?tab=readme-ov-file"
        type: string
    secrets:
      aws-access-key-id:
        required: true
      aws-secret-access-key:
        required: true

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        if: github.event_name != 'pull_request'
        with:
          aws-access-key-id: ${{ secrets.aws-access-key-id }}
          aws-secret-access-key: ${{ secrets.aws-secret-access-key }}
          aws-region: ${{ inputs.aws-region }}
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
        if: github.event_name != 'pull_request'
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ inputs.image }}
          tags: ${{ inputs.tags }}
          labels: ${{ inputs.labels }}
      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
